# Plot color palette — single source of truth for all figures.
#
# Semantic names, not CSS names. Each color serves a role in the visual language.
# Change a value here and all figures update on next `make figures`.

[semantic]
matched     = "#2E86AB"  # blue — correctly identified (TP)
halluc      = "#F5A623"  # orange — hallucinated (FP)
refusal     = "#BBBBBB"  # gray — model refusal markers
alert       = "#E74C3C"  # red — warning / primary reference
reference   = "#2ca02c"  # green — inventory reference line (163 plants)
local_model = "#1A5070"  # darker blue — Padme/local hardware models (vs cloud)
neutral     = "#444444"  # dark gray — colour-agnostic glyphs in legends
arm_naive      = "#AAAAAA"  # medium gray — Exp2 naive (single-shot) arm
arm_optimised  = "#0072B2"  # blue — Exp2 optimised (multi-turn) arm

# Architecture families — used by plot_scaling_curve.py for the Qwen 3.5 / Gemma 4
# scaling sweep. Each family has a direct + rag color pair. Independent concept
# from the language families below.
[families.qwen]
direct = "#AAAAAA"
rag    = "#2E86AB"

[families.gemma]
direct = "#CCAA88"
rag    = "#E07B39"

[families.fallback]
direct = "#888888"
rag    = "#444444"

# Language families — coding scheme described in manuscript Annex A: each
# journal-lineup model is bucketed by the dominant pre-training language
# (EN = Anglophone labs, FR = Mistral, ZH = mainland Chinese labs). Plots
# colored by language family must read from these entries via
# ``aedist.util.family_color()``. Colors are Wong colorblind-safe.
[language_families]
EN       = "#0072B2"  # blue
FR       = "#D55E00"  # vermillion
ZH       = "#009E73"  # bluish-green
fallback = "#999999"  # gray (unknown / non-journal-lineup)

# Provider → language family. Source of truth for who-belongs-where lives in
# experiments/models.yaml (the `provider` field); this table only encodes the
# lab-nationality mapping the manuscript uses. Add new providers here when
# the registry grows.
[language_families.provider_map]
Anthropic     = "EN"
OpenAI        = "EN"
Google        = "EN"
Meta          = "EN"
NVIDIA        = "EN"
xAI           = "EN"
Inception     = "EN"
Mistral       = "FR"
Alibaba       = "ZH"
Baidu         = "ZH"
ByteDance     = "ZH"
DeepSeek      = "ZH"
MiniMax       = "ZH"
"Moonshot AI" = "ZH"
StepFun       = "ZH"
Tencent       = "ZH"
Xiaomi        = "ZH"
"Zhipu AI"    = "ZH"

# Model-slug-prefix fallback for plots that operate on bare slugs (e.g. local
# Ollama models) and never see a provider field. Longest-prefix match wins.
[language_families.slug_prefix_map]
"claude"    = "EN"
"gpt"       = "EN"
"o1"        = "EN"
"o3"        = "EN"
