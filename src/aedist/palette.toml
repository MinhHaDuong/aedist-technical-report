# Plot color palette — single source of truth for all figures.
#
# Semantic names, not CSS names. Each color serves a role in the visual language.
# Change a value here and all figures update on next `make figures`.

[semantic]
matched   = "#2E86AB"  # blue — correctly identified (TP)
halluc    = "#F5A623"  # orange — hallucinated (FP)
refusal   = "#BBBBBB"  # gray — model refusal markers
alert     = "#E74C3C"  # red — warning / primary reference
reference = "#2ca02c"  # green — inventory reference line (163 plants)

[families.qwen]
single = "#AAAAAA"
rag    = "#2E86AB"

[families.gemma]
single = "#CCAA88"
rag    = "#E07B39"

[families.fallback]
single = "#888888"
rag    = "#444444"

[quality]
# One dot = one power plant; color encodes evidence level
hallucinated = "#E74C3C"  # red   — FP: plant not in reference
identified   = "#F1C40F"  # yellow — TP: matched by name
chars_ok     = "#E67E22"  # orange — TP + correct fuel/status/province
sourced      = "#27AE60"  # green  — TP + primary source citation
verified     = "#2E86AB"  # blue   — TP + independently verified
