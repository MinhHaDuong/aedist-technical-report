# ---------------------------------------------------------------------------
# Sweep configurations — experimental conditions
# ---------------------------------------------------------------------------

[sweeps.census]
mode = "single"
prompt = "prompts/prompt_structured.txt"
models = "models.yaml"
model_set = "census_cloud"
repeat = 3
budget_usd = 10
seed = 42
output = "outputs/census"

[sweeps.census_local]
mode = "single"
prompt = "prompts/prompt_structured.txt"
models = "models.yaml"
model_set = "census_local"
repeat = 3
budget_usd = 0
seed = 42
output = "outputs/census"
ollama_url = "http://localhost:11434/v1"

[sweeps.multiturn]
mode = "multiturn"
prompt = "prompts/prompt_structured.txt"
followups = "prompts/followups.txt"
models = "models_selected.yaml"
repeat = 3
budget_usd = 10
seed = 42
output = "outputs/multiturn"

[sweeps.web]
mode = "web"
prompt = "prompts/prompt_structured.txt"
models = "models_selected.yaml"
repeat = 3
budget_usd = 10
seed = 42
output = "outputs/web"

[sweeps.rag]
mode = "rag"
prompt = "prompts/prompt_structured.txt"
corpus = "data/rag_corpus"
strategy = "wholesale"
models = "models.yaml"
model_set = "rag"
repeat = 3
budget_usd = 10
seed = 42
output = "outputs/rag"

[sweeps.decomposed]
mode = "decomposed"
prompt = "prompts/prompt_structured.txt"
corpus = "../data/rag_corpus"
models = "models_selected.yaml"
repeat = 3
budget_usd = 2
seed = 42
output = "outputs/decomposed"

# Verification regimes on top 3 configs
#
# Question: What is the marginal cost of going from "AI says 120 plants"
# to "120 plants with traceable provenance"?
#
# Evidence rubric (per plant):
#   0 = hallucinated source, 1 = no sources, 2 = 1 secondary,
#   3 = 1 primary, 4 = 2+ independent primary
# Proof-of-concept: single best config (DeepSeek V3.2 decomposed, F1=98.8%)
# Full 3-config factorial is Phase 5 work.
[sweeps.verification]
repeat = 3
budget_usd = 5
seed = 42
output = "derived/verification"
cross_verifier = "anthropic/claude-sonnet-4.6"
verification_modes = ["unverified", "tool", "self", "cross", "web"]

[[sweeps.verification.base_configs]]
method = "decomposed"
model = "deepseek/deepseek-v3.2"
result_file = "outputs/decomposed/deepseek-v3.2-run3.json"

# Phase 5: expand to 3-config factorial after conference
# [[sweeps.verification.base_configs]]
# method = "multiturn"
# model = "claude-opus-4.6"
# result_file = "outputs/multiturn/claude-opus-4.6-run3.json"
#
# [[sweeps.verification.base_configs]]
# method = "rag"
# model = "google/gemini-2.5-flash-lite"
# result_file = "outputs/rag/gemini-2.5-flash-lite-run2.json"
#
# [[sweeps.verification.base_configs]]
# method = "rag"
# model = "openai/gpt-5.4"
# result_file = "outputs/rag/gpt-5.4-run1.json"

# Verification proof-of-concept: 1 config, 2 deterministic modes
#
# Stage B of ticket 0030. Minimal design: unverified vs tool on the
# best decomposed RAG config. Zero API cost (both modes are local).
# Validates the precision-coverage tradeoff before committing to the
# full factorial in [sweeps.verification] (Stage D).
[sweeps.verification_poc]
repeat = 1
budget_usd = 0
seed = 42
output = "derived/verification_poc"
verification_modes = ["unverified", "tool"]

[[sweeps.verification_poc.base_configs]]
method = "decomposed"
model = "deepseek/deepseek-chat"
result_file = "outputs/decomposed/deepseek-v3.2-run1.json"

# Multi-agent verification: panel of 3 diverse verifiers
#
# Ticket 0059. Cross-verification with k=3 independent verifiers,
# median aggregation. Tests whether multi-agent diversity improves
# hallucination detection beyond single cross-verification.
# Panel: Anthropic (US, dense), OpenAI (US, dense), DeepSeek (CN, MoE).
[sweeps.verification_multi]
repeat = 3
budget_usd = 5
seed = 42
output = "derived/verification_multi"
verification_modes = ["unverified", "multi_cross"]
verifier_panel = [
    "anthropic/claude-sonnet-4.6",
    "openai/gpt-5.4",
    "deepseek/deepseek-v3.2",
]

[[sweeps.verification_multi.base_configs]]
method = "decomposed"
model = "deepseek/deepseek-v3.2"
result_file = "outputs/decomposed/deepseek-v3.2-run3.json"

# Sourced extraction — ask for citations upfront
#
# Same RAG setup, but prompt includes source_1, source_2, note columns.
# Paired comparison: does requiring provenance change extraction?
#
# Story arc: census (list plants) → sourced (list plants with sources)
# → if models cite real documents, source-first RAG is feasible.
[sweeps.sourced]
mode = "rag"
prompt = "prompts/prompt_structured_sourced.txt"
corpus = "data/rag_corpus"
strategy = "wholesale"
models = "models.yaml"
model_set = "sourced"
repeat = 3
budget_usd = 10
seed = 42
output = "outputs/sourced"

# Frontier deep-research: reasoning/deep-research models, 3 prompts
# (inventory, scenarios, skill), 1 run each, high max_tokens
[sweeps.frontier]
mode = "single"
prompt = "prompts/prompt_frontier.txt"
models = "models.yaml"
model_set = "frontier_10labs"
repeat = 1
budget_usd = 20
seed = 42
output = "outputs/frontier"

[sweeps.frontier_scenarios]
mode = "single"
prompt = "prompts/prompt_frontier_scenarios.txt"
models = "models.yaml"
model_set = "frontier_3best"
repeat = 1
budget_usd = 20
seed = 42
output = "qualitative/scenarios"

[sweeps.frontier_skill]
mode = "single"
prompt = "prompts/prompt_frontier_skill.txt"
models = "models.yaml"
model_set = "frontier_3best"
repeat = 1
budget_usd = 20
seed = 42
output = "qualitative/skill_plans"

# --- Prompt composition and ablation (ticket 0038) ---
# Prompts assembled at runtime from modules in prompts/modules/.
# "modules" key lists which modules to include; base.txt is always included.
# Module ordering is handled by assemble_prompt() in harness.py.
#
# Pilot: 2 reps per condition.  Paper upgrade: 5 reps, more models.
# Temperature: provider-recommended for structured extraction (0.0–0.3).
# DeepSeek note: API temp 1.0 maps internally to 0.3 (their recommended).
#
# All modules: persona, overview, sourcing, narratives, bibliography, statistics

# Phase 1 — Selection: base vs composite across 3 regimes
