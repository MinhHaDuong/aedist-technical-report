# ---------------------------------------------------------------------------
# Sweep configurations — experimental conditions
# ---------------------------------------------------------------------------

[sweeps.sweep_direct_extract]
mode = "single"
prompt = "prompts/prompt_extract.txt"
models = "models.yaml"
model_set = "modelset_census_cloud"
repeat = 3
budget_usd = 10
seed = 42
output = "outputs/direct_extract"

[sweeps.sweep_direct_extract_local]
