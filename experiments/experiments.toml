# ---------------------------------------------------------------------------
# Sweep configurations — experimental conditions
# ---------------------------------------------------------------------------

[sweeps.census]
mode = "single"
prompt = "prompts/prompt_structured.txt"
models = "models.yaml"
model_set = "census_cloud"
repeat = 3
budget_usd = 10
output = "outputs/census"

[sweeps.census_local]
mode = "single"
prompt = "prompts/prompt_structured.txt"
models = "models.yaml"
model_set = "census_local"
repeat = 3
budget_usd = 0
output = "outputs/census"
ollama_url = "http://localhost:11434/v1"

[sweeps.multiturn]
mode = "multiturn"
prompt = "prompts/prompt_structured.txt"
followups = "prompts/followups.txt"
models = "models_selected.yaml"
repeat = 3
budget_usd = 10
output = "outputs/multiturn"

[sweeps.web]
mode = "web"
prompt = "prompts/prompt_structured.txt"
models = "models_selected.yaml"
repeat = 3
budget_usd = 10
output = "outputs/web"

[sweeps.rag]
mode = "rag"
prompt = "prompts/prompt_structured.txt"
corpus = "data/rag_corpus"
strategy = "wholesale"
models = "models.yaml"
model_set = "rag"
repeat = 3
budget_usd = 10
output = "outputs/rag"

[sweeps.decomposed]
mode = "decomposed"
prompt = "prompts/prompt_structured.txt"
corpus = "../data/rag_corpus"
models = "models_selected.yaml"
repeat = 3
budget_usd = 2
output = "outputs/decomposed"

# Verification regimes on top 3 configs
#
# Question: What is the marginal cost of going from "AI says 120 plants"
# to "120 plants with traceable provenance"?
#
# Evidence rubric (per plant):
#   0 = hallucinated source, 1 = no sources, 2 = 1 secondary,
#   3 = 1 primary, 4 = 2+ independent primary
[sweeps.verification]
repeat = 3
budget_usd = 25
output = "derived/verification"
cross_verifier = "anthropic/claude-sonnet-4.6"
verification_modes = ["unverified", "tool", "self", "cross", "web"]

[[sweeps.verification.base_configs]]
method = "multiturn"
model = "claude-opus-4.6"
result_file = "outputs/multiturn/claude-opus-4.6-run3.json"

[[sweeps.verification.base_configs]]
method = "rag"
model = "google/gemini-2.5-flash-lite"
result_file = "outputs/rag/gemini-2.5-flash-lite-run2.json"

[[sweeps.verification.base_configs]]
method = "rag"
model = "openai/gpt-5.4"
result_file = "outputs/rag/gpt-5.4-run1.json"

# Sourced extraction — ask for citations upfront
#
# Same RAG setup, but prompt includes source_1, source_2, note columns.
# Paired comparison: does requiring provenance change extraction?
#
# Story arc: census (list plants) → sourced (list plants with sources)
# → if models cite real documents, source-first RAG is feasible.
[sweeps.sourced]
mode = "rag"
prompt = "prompts/prompt_structured_sourced.txt"
corpus = "data/rag_corpus"
strategy = "wholesale"
models = "models.yaml"
model_set = "sourced"
repeat = 3
budget_usd = 10
output = "outputs/sourced"

# Frontier deep-research: reasoning/deep-research models, 3 prompts
# (inventory, scenarios, skill), 1 run each, high max_tokens
[sweeps.frontier]
mode = "single"
prompt = "prompts/prompt_frontier.txt"
models = "models.yaml"
model_set = "frontier_10labs"
repeat = 1
budget_usd = 20
output = "outputs/frontier"

[sweeps.frontier_scenarios]
mode = "single"
prompt = "prompts/prompt_frontier_scenarios.txt"
models = "models.yaml"
model_set = "frontier_3best"
repeat = 1
budget_usd = 20
output = "qualitative/scenarios"

[sweeps.frontier_skill]
mode = "single"
prompt = "prompts/prompt_frontier_skill.txt"
models = "models.yaml"
model_set = "frontier_3best"
repeat = 1
budget_usd = 20
output = "qualitative/skill_plans"
