# --- Prompt composition and ablation (ticket 0038, harness rewrite in 0175) ---
# Prompts assembled at runtime from modules in prompts/modules/.
# "prompt_modules" lists optional modules; 2_goal and 5_table are the
# always-pair (see ALWAYS_MODULES in harness.py). The assembled prompt
# concatenates modules in filename lex order, joined with "\n\n".
#
# Pilot: 2 reps per condition.  Paper upgrade: 5 reps, more models.
# Temperature: provider-recommended for structured extraction (0.0–0.3).
# DeepSeek note: API temp 1.0 maps internally to 0.3 (their recommended).
#
# All optional modules: 1_persona, 3_overview, 4_narratives, 6_bibliography,
# A_Statistics, B_Temporality, C_Uncertainty, D_Completeness

# Phase 1 — Selection: base vs composite across 3 regimes
# Uses modelset_ablation_dev (cheap reasoning models) for pipeline validation.
# Upgrade to modelset_ablation_journal for final production runs.

# Parametric regime (no docs, no search) — Experiment 1 production baseline.
# Locked by ticket 0175: 16-model journal set × 5 reps = 80 runs.
# prompt_modules = [] → assemble_prompt() returns the always-pair only
# (2_goal + 5_table); see harness.py and modules/README.md.
# system_instruction declares no-web-search for the parametric regime.
[sweeps.sweep_ablation_p1_direct_base]
mode = "single"
prompt_modules = []
models = "models.yaml"
model_set = "modelset_ablation_journal"
repeat = 5
temperature = 0.0
seed = 42
budget_usd = 15
max_tokens = 32768
system_instruction = "You have no web search capability. Do not claim to perform searches, do not invoke tools, do not fabricate URLs. Answer from parametric knowledge only."
output = "outputs/ablation/direct/p1_base"

# Ticket 0198: reasoning-intensity top-up. Same call shape as the base
# sweep; new reps capture reasoning_tokens (PR #379). Canary = repeat 1,
# then repeat 3 for top-up (run 1 skipped by should_skip). Pooled with
# original 5-rep baseline for outcome metrics; reasoning_tokens reported
# from post-fix cohort only.
[sweeps.sweep_ablation_p1_direct_base_topup]
mode = "single"
prompt_modules = []
models = "models.yaml"
model_set = "modelset_exp1_baseline"
repeat = 3
temperature = 0.0
seed = 42
budget_usd = 8
max_tokens = 32768
system_instruction = "You have no web search capability. Do not claim to perform searches, do not invoke tools, do not fabricate URLs. Answer from parametric knowledge only."
output = "outputs/ablation/direct/p1_base.topup"

