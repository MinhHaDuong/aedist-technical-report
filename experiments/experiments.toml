# ---------------------------------------------------------------------------
# Fusion prototype sweeps (prototype_v1_fusion.py)
# ---------------------------------------------------------------------------
# provider pins to a single backend so seed is honoured and
# cross-provider floating-point variance is eliminated.
# Alibaba supports seed on deepseek-v3.2; DeepSeek native does not.

[sweeps.sweep_fusion]
# fusion_mode: pipeline scope — incremental | global | compare (all cells)
fusion_mode = "compare"
format = "both"
model = "deepseek/deepseek-v3.2"
corpus = "data/rag_corpus"
reference = "data/reference/vietnam_thermal_v1.csv"
output = "derived/fusion_proto"
seed = 42
provider = "Alibaba"

[sweeps.sweep_fusion_dev]
fusion_mode = "compare"
format = "md"
model = "openai/gpt-4o-mini"
corpus = "data/rag_corpus"
reference = "data/reference/vietnam_thermal_v1.csv"
output = "derived/fusion_proto_dev"
seed = 42

# Ticket 0160: example sweep exercising the claude-code-cli route.
# Authenticates via the user's existing Claude Code session — no
# API key needed in the sweep environment. Bills against the user's
# Anthropic subscription/plan, not registry pricing. Useful for
# qualitative capability checks; not suitable for controlled sweeps
# (no T=0/seed/max_tokens control).
#
# IMPORTANT (ticket 0209): this sweep runs via the legacy
# `python -m aedist.query_direct --sweep sweep_smoke_claude_cli` path
# ONLY. The job-board worker (`aedist.worker`) raises NotImplementedError
# for route=claude-code-cli — the route's lack of T=0/seed/max_tokens
# control is incompatible with the worker's budget / reproducibility
# semantics. Do not run `aedist.manager generate --sweep
# sweep_smoke_claude_cli && aedist.worker openrouter --drain` with this
# config; you'll get a fast-failing NotImplementedError per job.
[sets.modelset_claude_cli_smoke]
model_ids = [
    "claude-sonnet-4-6-cli",
]

[sweeps.sweep_smoke_claude_cli]
mode = "single"
prompt_modules = []
models = "models.yaml"
model_set = "modelset_claude_cli_smoke"
repeat = 1
temperature = 0.0
seed = 42
budget_usd = 1
max_tokens = 4096
system_instruction = "You have no web search capability. Do not claim to perform searches, do not invoke tools, do not fabricate URLs. Answer from parametric knowledge only."
output = "outputs/smoke/claude_cli"

# Exp 1 batch 2 — rerun with protocol_07_naive_prompt.md (GEM vocab, unified schema).
# 12 models: Anthropic×3, OpenAI×3, Qwen×4, DeepSeek×2. No Mistral.
# Parallelize via: manager generate --sweep sweep_exp1_batch2 && N × worker drain
[sweeps.sweep_exp1_batch2]
mode = "single"
prompt = "sota/protocol_07_naive_prompt.md"
models = "models.yaml"
model_set = "modelset_exp1_batch2"
repeat = 5
temperature = 0.0
seed = 42
budget_usd = 30
max_tokens = 65536
web_search = false
system_instruction = "You have no web search capability. Do not claim to perform searches, do not invoke tools, do not fabricate URLs. Answer from parametric knowledge only."
output = "outputs/exp1_batch2"
