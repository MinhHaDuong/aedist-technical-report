# ---------------------------------------------------------------------------
# Fusion prototype sweeps (prototype_v1_fusion.py)
# ---------------------------------------------------------------------------
# provider pins to a single backend so seed is honoured and
# cross-provider floating-point variance is eliminated.
# Alibaba supports seed on deepseek-v3.2; DeepSeek native does not.

[sweeps.sweep_fusion]
# fusion_mode: pipeline scope — incremental | global | compare (all cells)
fusion_mode = "compare"
format = "both"
model = "deepseek/deepseek-v3.2"
corpus = "data/rag_corpus"
reference = "data/reference/vietnam_thermal_v1.csv"
output = "derived/fusion_proto"
seed = 42
provider = "Alibaba"

[sweeps.sweep_fusion_dev]
fusion_mode = "compare"
format = "md"
model = "openai/gpt-4o-mini"
corpus = "data/rag_corpus"
reference = "data/reference/vietnam_thermal_v1.csv"
output = "derived/fusion_proto_dev"
seed = 42
