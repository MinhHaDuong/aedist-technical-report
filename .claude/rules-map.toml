# Axis manifest (mapping only, no rule text): ~/.agents/rules/README.md
# § Axis model; resolver: ~/.agents/scripts/prose_predicate.py. First match wins.
# Doctype comes from the \documentclass sniff (report -> techreport,
# beamer -> slides, article -> article), so no entry overrides it; the
# manifest supplies the language, which markup does not carry.
# Most repo prose (README, most docs, memory, preprint, English deck) is
# English; the French Markdown files are mapped one by one below.
default_lang = "en"

# French technical report, its glossary and verification fragments. Some
# generated English tables under report/inputs/generated/ also match; they
# carry no doctype and are never hand-edited, so the label is harmless.
[[map]]
glob = "report/**/*.tex"
lang = "fr"

# French beamer deck. The English deck slides-en.tex and the preprint
# slides/manuscript/main.tex fall through to default_lang.
[[map]]
glob = "slides/slides.tex"
lang = "fr"

# French Markdown documents (ADR-1 to ADR-6, French-body notes).
[[map]]
glob = "ADR.md"
lang = "fr"

[[map]]
glob = "docs/alignment_analysis.md"
lang = "fr"

[[map]]
glob = "docs/2026-05-26-panel-review-state.md"
lang = "fr"

[[map]]
glob = "docs/HaDuong-2026-EconomIA-Abstract.md"
lang = "fr"
